name: Paper Trading Bot (5h runtime)

on:
  schedule:
    # Example: 8:30 AM CST = 14:30 UTC (CST only; does not adapt to CDT)
    - cron: "30 14 * * 1-5"
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours total budget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore bot state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bot_state.json
            trade_log.jsonl
          key: paperbot-state-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            paperbot-state-${{ github.ref }}-

      - name: Run paper trading bot (5 hours)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python trading_bot.py

      # This step runs after the script exits (after ~5 hours),
      # leaving time for caching/upload within the 6-hour job timeout.
      - name: Save bot state cache
        uses: actions/cache/save@v4
        with:
          path: |
            bot_state.json
            trade_log.jsonl
          key: paperbot-state-${{ github.ref }}-${{ github.run_id }}
